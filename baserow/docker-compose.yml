version: "3.8"
services:
  baserow:
    image: baserow/baserow:1.30.1
    container_name: baserow
    networks:
      - growon
    labels:
      - traefik.enable=true
      - traefik.http.routers.baserow.rule=Host(`baserow.$GATEWAY_HOST`)
      - traefik.http.routers.baserow.entrypoints=web,websecure
      - traefik.http.routers.baserow.tls.certresolver=letsencrypt
      - traefik.http.services.baserow.loadbalancer.server.port=80
      - traefik.http.routers.baserow.middlewares=authelia@docker
    environment:
      - BASEROW_PUBLIC_URL=${BASEROW_PUBLIC_URL}  
    volumes:
      - baserow_data:/baserow/data
    restart: unless-stopped
    expose:
      - 80

volumes:
  baserow_data:

networks:
  growon:
    external: true
